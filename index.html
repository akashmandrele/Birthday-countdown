<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-Day Magic - Swara</title>
    <!-- Fonts & Canvas Fireworks -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: #0d081e; /* Deep night background */
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Top Navigation Header */
        header {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            z-index: 20;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ff52a1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .customize-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #d1c4e9;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: 0.3s ease;
        }

        .customize-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        /* Main Content Container */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 20;
            margin: auto 0;
            width: 100%;
            position: relative;
        }

        .subtitle {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #ff65a3;
            margin-bottom: 12px;
        }

        .person-name {
            font-size: 3.5rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
        }

        .target-date {
            color: #b3a2c7;
            font-size: 1.05rem;
            margin-bottom: 35px;
            font-weight: 400;
        }

        /* Countdown Cards Grid */
        .countdown-grid {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .time-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 20px 22px;
            min-width: 90px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: #c77dff;
        }

        .time-card:nth-child(2) .time-number { color: #b5179e; }
        .time-card:nth-child(3) .time-number { color: #4895ef; }
        .time-card:nth-child(4) .time-number { color: #4cc9f0; }

        .time-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #8d7a9e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* Special Love Message Below Countdown */
        .love-line {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ff758c;
            text-shadow: 0 0 12px rgba(255, 117, 140, 0.5);
            letter-spacing: 0.5px;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        /* Birthday Cake & Wish Area */
        .celebration-box {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            animation: fadeIn 1s ease-in-out;
            z-index: 25;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            pointer-events: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .cake-emoji {
            font-size: 7rem;
            filter: drop-shadow(0 0 30px #ff758c);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .wish-text {
            color: #ff758c;
            font-size: 2.8rem;
            margin-top: 25px;
            font-weight: 800;
            text-shadow: 0 0 20px rgba(255, 117, 140, 0.7);
        }

        .wish-subtext {
            color: #d1c4e9;
            font-size: 1.2rem;
            margin-top: 10px;
            max-width: 80%;
        }

        /* Canvas for persistent Fireworks */
        #fireworks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        footer {
            z-index: 20;
            color: #6c5b7b;
            font-size: 0.85rem;
            margin-top: 20px;
        }

        footer span {
            color: #ff477e;
        }
    </style>
</head>
<body>

    <!-- Persistent Fireworks Canvas -->
    <canvas id="fireworks-canvas"></canvas>

    <!-- Header -->
    <header>
    
    </header>

    <!-- Main Section -->
    <div class="main-content">
        <div class="subtitle">Counting Down To</div>
        <div class="person-name" id="nameText">Swara Birthday</div>
        <div class="target-date" id="dateText">October 9, 2026 at 12:00 AM</div>

        <!-- Countdown Grid -->
        <div class="countdown-grid" id="countdownGrid">
            <div class="time-card">
                <span class="time-number" id="days">00</span>
                <span class="time-label">DAYS</span>
            </div>
            <div class="time-card">
                <span class="time-number" id="hours">00</span>
                <span class="time-label">HOURS</span>
            </div>
            <div class="time-card">
                <span class="time-number" id="mins">00</span>
                <span class="time-label">MINS</span>
            </div>
            <div class="time-card">
                <span class="time-number" id="secs">00</span>
                <span class="time-label">SECS</span>
            </div>
        </div>

        <!-- Special Love Line -->
        <div class="love-line" id="loveLine">
            Counting Down the Days until your special day , MY LOVE ❤️
        </div>

        <!-- Birthday Cake & Wish Area -->
        <div class="celebration-box" id="celebrationBox">
            <div class="cake-emoji">🎂✨</div>
            <h2 class="wish-text">Happy Birthday, Swara! 🎉</h2>
            <p class="wish-subtext">Wishing you a day filled with happiness, love, and sweet surprises!</p>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        Created with <span>❤️</span> for special celebrations
    </footer>

    <script>
        // Parameters Setup
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name') || "Swara birthday";
        const dateStr = urlParams.get('date') || "2026-10-09T00:00:00";

        document.getElementById('nameText').innerText = name;
        
        const targetDate = new Date(dateStr).getTime();
        
        // Update Target Date Text
        const options = { month: 'long', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' };
        document.getElementById('dateText').innerText = new Date(targetDate).toLocaleDateString('en-US', options);

        let finalFireworksTriggered = false;
        let persistentInterval;

        // Fireworks Setup and Logic
        function startPersistentFireworks() {
            var defaults = { startVelocity: 25, spread: 360, ticks: 120, zIndex: 0 };
            
            persistentInterval = setInterval(function() {
                if (finalFireworksTriggered) return;

                confetti(Object.assign({}, defaults, { 
                    particleCount: 15, 
                    origin: { x: randomInRange(0.1, 0.4), y: Math.random() - 0.2 } 
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount: 15, 
                    origin: { x: randomInRange(0.6, 0.9), y: Math.random() - 0.2 } 
                }));
            }, 800);
        }

        function triggerFinalCelebration() {
            var duration = 15 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 40, spread: 360, ticks: 70, zIndex: 0 };

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 60 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.0, 1.0), y: Math.random() - 0.1 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.0, 1.0), y: Math.random() - 0.1 } }));
            }, 300);
        }

        function randomInRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        // Countdown Logic
        function updateCountdown() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                // Birthday Time Reached!
                document.getElementById('countdownGrid').style.display = 'none';
                document.getElementById('loveLine').style.display = 'none';
                document.getElementById('celebrationBox').style.display = 'flex';
                
                if (!finalFireworksTriggered) {
                    clearInterval(persistentInterval);
                    triggerFinalCelebration();
                    finalFireworksTriggered = true;
                }
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('mins').innerText = String(mins).padStart(2, '0');
            document.getElementById('secs').innerText = String(secs).padStart(2, '0');
        }

        startPersistentFireworks();
        setInterval(updateCountdown, 1000);
        updateCountdown();

        function customizeUrl() {
            const newName = prompt("Enter Name:", "Swara");
            const newDate = prompt("Enter Birthday Date (YYYY-MM-DD):", "2026-10-09");
            if (newName && newDate) {
                window.location.href = `?name=${encodeURIComponent(newName)}&date=${newDate}T00:00:00`;
            }
        }
    </script>
</body>
</html>
